<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SingPick</title>

<style>
* {
  box-sizing: border-box;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

body {
  margin: 0;
  background: #fafafa;
}

.page {
  display: none;
  padding-bottom: 70px;
}

.page.active {
  display: block;
}

header {
  position: fixed;
  top: 0;
  width: 100%;
  height: 70px;
  background: #fafafa;
  text-align: center;
  line-height: 70px;
  font-size: 28px;
  font-weight: bold;
  z-index: 10;
  border-bottom: 1px solid #ddd;
}


.line {
  display: none;
}

.content {
  padding: 20px;
  padding-top: 90px;
}

.box {
  background: white;
  border-radius: 12px;
  padding: 16px;
  margin-bottom: 15px;
  min-height: 100px;
  box-shadow: 0 0 6px rgba(0,0,0,0.05);
}

/* 하단 네비게이션 */
.nav {
  position: fixed;
  bottom: 0;
  width: 100%;
  height: 60px;
  background: white;
  border-top: 1px solid #ddd;
  display: flex;
}

.nav button {
  flex: 1;
  border: none;
  background: none;
  font-size: 16px;
}

.nav button.active {
  color: #ff4d6d;
  font-weight: bold;
  border-top: 3px solid #ff4d6d;
}

</style>
</head>

<body>

<!-- 홈 화면 -->
<div id="home" class="page active">
  <header>SING PICK</header>
  <div class="line"></div>

 <div class="content">

  <!-- 곡 추천 -->
  <div class="box">
    <strong>🎶 곡 추천</strong>
    <p id="song">추천 가수/곡 표시 예정</p>
  </div>

  <!-- 사용자 분석 피드백 -->
  <div class="box">
    <strong>🎤 사용자 분석 피드백</strong>
    <p id="feedback">분석된 피드백 표시 예정</p>
  </div>

  <!-- 음성 분석 그래프 -->
  <div class="box">
    <strong>📊 내 음성 그래프</strong>
    <p id="graph">음정, 음색, 음역대 등의 그래프 표시 예정</p>
  </div>

</div>
</div>

<!-- 마이페이지 -->
<div id="mypage" class="page">
  <header>SING PICK</header>
  <div class="line"></div>

  <div class="content">
  <div style="font-size:20px; font-weight:bold; margin-bottom:10px;">
    USER_ID
  </div>
  <div style="border-top:1px solid #ddd; margin-bottom:20px;"></div>
  <div class="box">
    <strong>My 'Sing Pick'</strong>
    <p id="history">누적 피드백 기록 표시 예정</p>
  </div>
  </div>
</div>


<!-- 네비게이션 -->
<div class="nav">
  <button id="nav-home" onclick="showPage('home')">Home</button>
  <button id="nav-mypage" onclick="showPage('mypage')">My Page</button>
</div>

<script>
function showPage(page) {
  // 페이지 전환
  document.querySelectorAll(".page").forEach(p => {
    p.classList.remove("active");
  });
  document.getElementById(page).classList.add("active");

  // 네비게이션 상태 초기화
  document.querySelectorAll(".nav button").forEach(b => {
    b.classList.remove("active");
  });

  // 현재 페이지에 맞는 버튼 강조
  if (page === "home") {
    document.getElementById("nav-home").classList.add("active");
  } else if (page === "mypage") {
    document.getElementById("nav-mypage").classList.add("active");
  }
}

// 페이지 처음 열릴 때 홈으로 세팅
showPage("home");
</script>



</body>
</html>
